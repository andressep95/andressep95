name: Metrics
on:
  schedule:
    - cron: '0 0 * * *' # Daily update
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Metrics
        uses: actions/cache@v3
        with:
          path: generated
          key: ${{ runner.os }}-metrics-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-metrics-

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/metrics.yml
          output: generated
          filename: github-metrics.svg

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f "generated/github-metrics.svg" ]; then
            # Verificar si hay cambios reales en el archivo
            if git diff --quiet generated/github-metrics.svg; then
              echo "No changes detected in metrics"
              exit 0
            fi
            
            git add generated/github-metrics.svg
            git commit -m "📊 Update GitHub metrics [skip ci]" || echo "No changes to commit"
            git push || (git pull --rebase && git push)
          else
            echo "::error::Metrics file not generated"
            exit 1
          fi